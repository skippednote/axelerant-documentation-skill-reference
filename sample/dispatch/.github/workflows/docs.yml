name: docs-check

on:
  workflow_call:
  pull_request:
    paths: ["**/*.md", ".axelerant/repo.yml", ".github/workflows/docs.yml"]

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Contract, frontmatter, placeholders, budgets
        run: python3 .axelerant/docs_audit.py --strict

      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "**/*.md"

      - name: Vale
        uses: errata-ai/vale-action@reviewdog
        with:
          fail_on_error: true

      - name: Link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --accept 200,206,429 "**/*.md"
          fail: true
