# .github/workflows/docs.yml — the whole enforcement setup for a repo.
# Copy this file in. Nothing else is vendored; the contract and the checks are
# pulled from the reference repo at the pinned ref.
name: docs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs:
    uses: skippednote/axelerant-documentation-skill-reference/.github/workflows/docs-check.yml@v1
    with:
      path: "."
      strict: true      # set false for the warn-only period, then flip
      ref: v1
      # Directories of file templates, whose relative links resolve only once
      # the template is instantiated. Omit if the repo has none.
      # link_exclude_paths: path/to/templates

  coupling:
    if: github.event_name == 'pull_request'
    # Required. A called workflow cannot hold more permission than the caller
    # grants it, and without this the whole file is rejected at startup.
    permissions:
      contents: read
      pull-requests: write
    uses: skippednote/axelerant-documentation-skill-reference/.github/workflows/docs-coupling.yml@v1
