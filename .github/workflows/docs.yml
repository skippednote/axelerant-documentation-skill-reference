name: docs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  workflows:
    name: Workflow syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/check_workflows.py
      - name: The Vale style is generated, not hand-edited
        run: |
          python3 skills/axelerant-engineering-documentation/scripts/docs_audit.py \
            --emit-vale > /tmp/Fluff.yml
          diff -u styles/Axelerant/Fluff.yml /tmp/Fluff.yml

  self:
    name: This repo
    uses: ./.github/workflows/docs-check.yml
    with:
      path: "."
      link_exclude_paths: skills/axelerant-engineering-documentation/references/templates

  sample:
    name: Worked example
    uses: ./.github/workflows/docs-check.yml
    with:
      path: sample/dispatch
      skip_links: true

  coupling:
    name: Coupling
    if: github.event_name == 'pull_request'
    # A called workflow cannot hold more permission than the caller grants it.
    # Without this the whole file is rejected before any job starts.
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/docs-coupling.yml
    with:
      ref: ${{ github.sha }}
