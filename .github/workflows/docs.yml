name: docs
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  local-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14.7
      - run: python3 -m pip install -r requirements-ci.txt
      - run: make verify
  self:
    uses: ./.github/workflows/docs-check.yml
    with:
      path: .
      ref: ${{ github.sha }}
      enforcement: block
  sample:
    uses: ./.github/workflows/docs-check.yml
    with:
      path: sample/dispatch
      ref: ${{ github.sha }}
      enforcement: block
  coupling:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/docs-coupling.yml
    with:
      ref: ${{ github.sha }}
