name: docs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  workflows:
    name: Workflow syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_workflows.py

  self:
    name: This repo
    uses: ./.github/workflows/docs-check.yml
    with:
      path: "."
      link_exclude_paths: skills/axelerant-engineering-documentation/references/templates
