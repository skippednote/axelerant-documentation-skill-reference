name: docs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  workflows:
    name: Workflow syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse every workflow file
        run: |
          python3 - <<'EOF'
          import glob, sys, yaml
          bad = 0
          for f in glob.glob(".github/workflows/*.yml") + glob.glob("**/.github/workflows/*.yml", recursive=True):
              try:
                  yaml.safe_load(open(f))
                  print("ok  ", f)
              except Exception as e:
                  print("FAIL", f, e); bad = 1
          sys.exit(bad)
          EOF

  self:
    name: This repo
    uses: ./.github/workflows/docs-check.yml
    with:
      path: "."
      # File templates carry relative links that only resolve once instantiated.
      link_exclude_paths: skills/axelerant-engineering-documentation/references/templates

  sample:
    name: Worked example
    uses: ./.github/workflows/docs-check.yml
    with:
      path: sample/dispatch
      skip_links: true

  coupling:
    name: Coupling
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/docs-coupling.yml
