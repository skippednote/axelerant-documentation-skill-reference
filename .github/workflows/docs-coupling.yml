name: docs-coupling

on:
  workflow_call:
    inputs:
      code_paths:
        description: Newline-separated globs treated as code.
        type: string
        default: |
          src/**
          internal/**
          app/**
          lib/**

permissions:
  pull-requests: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Comment when code moved and docs did not
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed=$(git diff --name-only "$base" "$head")
          code=$(echo "$changed" | grep -Ev '^(docs/|README|AGENTS|CLAUDE)' | grep -E '\.(go|py|php|ts|tsx|js|rb|java|tf)$' || true)
          docs=$(echo "$changed" | grep -E '^(docs/|README\.md)' || true)
          if [ -n "$code" ] && [ -z "$docs" ]; then
            gh pr comment "${{ github.event.pull_request.number }}" --body \
            "Code changed and no documentation did. If this changes how someone runs, deploys or reasons about the service, update the matching page and its \`last_verified\`. If it does not, ignore this."
          fi
